<div class="notification-message-wrapper">

  @for (message of messageService.messageList$ | async; track message) {
    <ng-container [ngTemplateOutlet]="notificationMessage" [ngTemplateOutletContext]="{ message: message }"></ng-container>
  }

</div>

<ng-template #notificationMessage let-notification="message">
  <div class="message">
    <div class="message-wrapper">
      <div class="message-info-container">
        <img src="/images/mail-icon.svg" alt="иконка сообщения" width="40px" height="40px">
        <div class="message-title">
          <span class="fs-16 bold">{{ notification.type }}</span>
          <span class="fs-14 regular">{{ notification.text }}</span>
        </div>
      </div>
      <div class="close-message-wrapper">
        <button [id]="'close-' + notification.text" class="close-message"
          (click)="messageService.closeMessage(notification)">
          <img src="/images/close-message-icon.svg" alt="иконка крестика" width="20px" height="20px">
        </button>
      </div>
    </div>
  </div>
</ng-template>
